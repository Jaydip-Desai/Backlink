version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: linkpilot-db
    environment:
      POSTGRES_DB: linkbridge_db
      POSTGRES_USER: linkbridge
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkbridge -d linkbridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linkpilot-net

  redis:
    image: redis:7-alpine
    container_name: linkpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - linkpilot-net

  backend:
    build:
      context: ./spring-backend
      dockerfile: Dockerfile
    container_name: linkpilot-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linkbridge_db
      SPRING_DATASOURCE_USERNAME: linkbridge
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linkpilot-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: linkpilot-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - linkpilot-net

volumes:
  postgres_data:
  redis_data:

networks:
  linkpilot-net:
    driver: bridge
