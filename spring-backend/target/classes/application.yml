spring:
  application:
    name: linkbridge
  datasource:
    url: jdbc:postgresql://localhost:5432/linkbridge_db
    username: linkbridge
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: 4b2a8d3e9f1c7a5b6d4e8f2c0a9b3d7e5f1a4c8b2d6e9f0a3c7b1e5d9f4a8c2
  expirationMs: 604800000 # 7 days
