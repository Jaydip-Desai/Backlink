server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: linkbridge

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linkbridge_db}
    username: ${SPRING_DATASOURCE_USERNAME:linkbridge}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expirationMs: 604800000
